<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700"><rect width="100%" height="100%" fill="white"/><text x="640" y="38" text-anchor="middle" font-family="sans-serif" font-size="27">Why a fast MXU still needs specialized bypass engines</text><text x="640" y="64" text-anchor="middle" font-family="sans-serif" font-size="13">schematic / not to scale / 根据 Google/TPU v4 与 TPU 8 公开资料重绘</text><g font-family="sans-serif"><rect x="60" y="125" width="330" height="450" fill="#f5f5f5" stroke="#333"/><text x="225" y="165" text-anchor="middle" font-size="22">Dense path</text><text x="225" y="220" text-anchor="middle">regular tiles / high reuse</text><rect x="115" y="330" width="220" height="100" fill="#e8e8e8" stroke="#333"/><text x="225" y="370" text-anchor="middle" font-size="20">MXU / TensorCore</text><text x="225" y="400" text-anchor="middle" font-size="14">dense matmul engine</text><rect x="475" y="125" width="330" height="450" fill="#f5f5f5" stroke="#333"/><text x="640" y="165" text-anchor="middle" font-size="22">Embedding path</text><text x="640" y="220" text-anchor="middle">indices / scatter-gather / all-to-all</text><rect x="530" y="330" width="220" height="100" fill="#e8e8e8" stroke="#333"/><text x="640" y="370" text-anchor="middle" font-size="20">SparseCore</text><text x="640" y="400" text-anchor="middle" font-size="14">memory/dataflow engine</text><rect x="890" y="125" width="330" height="450" fill="#f5f5f5" stroke="#333"/><text x="1055" y="165" text-anchor="middle" font-size="22">Decode collective path</text><text x="1055" y="220" text-anchor="middle">small reductions / frequent sync</text><rect x="945" y="330" width="220" height="100" fill="#e8e8e8" stroke="#333"/><text x="1055" y="370" text-anchor="middle" font-size="20">CAE</text><text x="1055" y="400" text-anchor="middle" font-size="14">collective/sync engine</text><text x="640" y="630" text-anchor="middle" font-size="17">Remove critical work whose execution shape is a poor fit for the MXU.</text></g></svg>
