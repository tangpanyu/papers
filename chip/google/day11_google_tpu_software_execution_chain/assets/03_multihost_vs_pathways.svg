<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="730">
<rect width="100%" height="100%" fill="white"/>
<text x="690" y="38" text-anchor="middle" font-family="sans-serif" font-size="28">Ordinary multi-host JAX vs JAX with Pathways</text>
<text x="690" y="64" text-anchor="middle" font-family="sans-serif" font-size="13">schematic / not to scale / based on current JAX and Pathways-on-Cloud docs</text>
<g font-family="sans-serif">
<rect x="55" y="115" width="600" height="500" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
<text x="355" y="155" text-anchor="middle" font-size="22">Multi-controller JAX</text>
<rect x="105" y="220" width="210" height="110" fill="#e8e8e8" stroke="#333"/>
<text x="210" y="255" text-anchor="middle" font-size="17">Host process 0</text>
<text x="210" y="285" text-anchor="middle" font-size="14">local TPU devices</text>
<rect x="395" y="220" width="210" height="110" fill="#e8e8e8" stroke="#333"/>
<text x="500" y="255" text-anchor="middle" font-size="17">Host process 1</text>
<text x="500" y="285" text-anchor="middle" font-size="14">local TPU devices</text>
<line x1="315" y1="275" x2="395" y2="275" stroke="#333" stroke-width="4"/>
<text x="355" y="390" text-anchor="middle" font-size="15">same Python program runs on each host</text>
<text x="355" y="425" text-anchor="middle" font-size="15">global jax.Array spans devices</text>
<text x="355" y="460" text-anchor="middle" font-size="15">each process sees host-local addressable devices</text>
<text x="355" y="495" text-anchor="middle" font-size="15">SPMD collectives coordinate data plane</text>

<rect x="725" y="115" width="600" height="500" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
<text x="1025" y="155" text-anchor="middle" font-size="22">JAX with Pathways</text>
<rect x="865" y="205" width="320" height="95" fill="#e8e8e8" stroke="#333"/>
<text x="1025" y="242" text-anchor="middle" font-size="17">JAX proxy / controller view</text>
<text x="1025" y="270" text-anchor="middle" font-size="14">all cluster devices appear local</text>
<rect x="785" y="380" width="210" height="95" fill="#e8e8e8" stroke="#333"/>
<text x="890" y="415" text-anchor="middle" font-size="17">TPU worker group A</text>
<rect x="1055" y="380" width="210" height="95" fill="#e8e8e8" stroke="#333"/>
<text x="1160" y="415" text-anchor="middle" font-size="17">TPU worker group B</text>
<line x1="1025" y1="300" x2="890" y2="380" stroke="#333" stroke-width="4"/>
<line x1="1025" y1="300" x2="1160" y2="380" stroke="#333" stroke-width="4"/>
<text x="1025" y="535" text-anchor="middle" font-size="15">Pathways handles orchestration / async dispatch / transfers</text>
<text x="690" y="675" text-anchor="middle" font-size="16">Important: Pathways is an optional higher-level distributed runtime, not a mandatory layer under every JAX-on-TPU program.</text>
</g></svg>