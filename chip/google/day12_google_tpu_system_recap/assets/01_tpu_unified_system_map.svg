<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#315b7d"/></marker><style>text{font-family:Arial,sans-serif;fill:#183044}.h{font-size:34px;font-weight:700}.t{font-size:25px;font-weight:700}.s{font-size:19px}.n{font-size:17px;fill:#52697a}.box{rx:18;stroke-width:3}.arr{stroke:#315b7d;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="#f7fafc"/><text x="800" y="58" text-anchor="middle" class="h">Google TPU: program-to-cluster system map</text><text x="800" y="88" text-anchor="middle" class="n">schematic / not to scale / redrawn from Google sources; internal NoC not disclosed</text>
<rect x="55" y="135" width="260" height="150" class="box" fill="#e5f2ff" stroke="#4b8fd3"/><text x="185" y="183" text-anchor="middle" class="t">Model + sharding</text><text x="185" y="222" text-anchor="middle" class="s">JAX / PyTorch</text><text x="185" y="254" text-anchor="middle" class="s">Mesh / PartitionSpec</text>
<rect x="365" y="135" width="300" height="150" class="box" fill="#e9f7ef" stroke="#4a9b69"/><text x="515" y="183" text-anchor="middle" class="t">Compiler + device API</text><text x="515" y="222" text-anchor="middle" class="s">XLA + Shardy</text><text x="515" y="254" text-anchor="middle" class="s">PJRT; Pallas/Mosaic</text>
<rect x="715" y="135" width="310" height="150" class="box" fill="#fff2dc" stroke="#d8912b"/><text x="870" y="183" text-anchor="middle" class="t">On-chip resources</text><text x="870" y="222" text-anchor="middle" class="s">MXU / VPU / Scalar</text><text x="870" y="254" text-anchor="middle" class="s">VMEM - HBM - DMA</text>
<rect x="1075" y="135" width="245" height="150" class="box" fill="#f7e9fa" stroke="#9a55aa"/><text x="1198" y="183" text-anchor="middle" style="font-size:21px;font-weight:700">Specialized offload</text><text x="1198" y="222" text-anchor="middle" class="s">SparseCore</text><text x="1198" y="254" text-anchor="middle" class="s">CAE (8i)</text>
<rect x="1370" y="135" width="180" height="150" class="box" fill="#edf0f2" stroke="#697985"/><text x="1460" y="183" text-anchor="middle" class="t">Host</text><text x="1460" y="222" text-anchor="middle" class="s">TPU VM / CPU</text><text x="1460" y="254" text-anchor="middle" class="s">I/O / orchestration</text>
<path d="M315 210H365" class="arr"/><path d="M665 210H715" class="arr"/><path d="M1025 210H1075" class="arr"/><path d="M1320 210H1370" class="arr"/>
<rect x="150" y="395" width="390" height="170" class="box" fill="#eaf3fc" stroke="#3978b6"/><text x="345" y="445" text-anchor="middle" class="t">Slice: ICI scale-up</text><text x="345" y="486" text-anchor="middle" class="s">chip links + torus / mesh</text><text x="345" y="522" text-anchor="middle" class="s">OCS outside a cube</text><text x="345" y="548" text-anchor="middle" class="n">topology and mapping still matter</text>
<rect x="655" y="395" width="310" height="170" class="box" fill="#f1eefe" stroke="#725ac1"/><text x="810" y="445" text-anchor="middle" class="t">Pod / Superpod</text><text x="810" y="486" text-anchor="middle" class="s">OCS + ICI fabric</text><text x="810" y="522" text-anchor="middle" class="s">throughput + resilience</text><text x="810" y="548" text-anchor="middle" class="n">implementation varies by generation</text>
<rect x="1080" y="395" width="370" height="170" class="box" fill="#fff1ec" stroke="#c26745"/><text x="1265" y="445" text-anchor="middle" class="t">DCN / multislice / storage</text><text x="1265" y="486" text-anchor="middle" class="s">ICI inside each slice</text><text x="1265" y="522" text-anchor="middle" class="s">DCN across slices; Virgo for 8t</text><text x="1265" y="548" text-anchor="middle" class="n">DCN is not merely slower ICI</text>
<path d="M870 285V340H345V395" class="arr"/><path d="M540 480H655" class="arr"/><path d="M965 480H1080" class="arr"/>
<rect x="155" y="675" width="1290" height="150" class="box" fill="#fff" stroke="#8298a8"/><text x="800" y="716" text-anchor="middle" class="t">Optimize the bottlenecked layer, not an abstract TPU utilization number</text><text x="270" y="768" text-anchor="middle" class="s">low AI: HBM / VMEM</text><text x="610" y="768" text-anchor="middle" class="s">bad sharding: collectives</text><text x="960" y="768" text-anchor="middle" class="s">bad mapping: ICI hops</text><text x="1300" y="768" text-anchor="middle" class="s">cross-slice: DCN / runtime</text><text x="800" y="807" text-anchor="middle" class="n">Compiler, placement, and runtime determine which physical boundaries are crossed</text>
</svg>
