<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#344f63"/></marker><style>text{font-family:Arial,sans-serif;fill:#183044}.h{font-size:34px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:18px}.n{font-size:16px;fill:#5c7282}.arr{stroke:#344f63;stroke-width:4;fill:none;marker-end:url(#a)}.box{rx:18;stroke-width:3}</style></defs>
<rect width="1600" height="850" fill="#f8fbfd"/><text x="800" y="58" text-anchor="middle" class="h">Two pressure chains under the same TPU abstraction</text><text x="800" y="88" text-anchor="middle" class="n">schematic / not to scale / typical pressure, not a claim about every model</text>
<text x="75" y="150" class="t">Large-scale training</text>
<rect x="75" y="185" width="240" height="120" class="box" fill="#e6f2ff" stroke="#4b8fd3"/><text x="195" y="233" text-anchor="middle" class="t">Large GEMMs</text><text x="195" y="270" text-anchor="middle" class="s">MXU throughput</text>
<rect x="390" y="185" width="240" height="120" class="box" fill="#fff0dc" stroke="#d98a25"/><text x="510" y="233" text-anchor="middle" class="t">Model state</text><text x="510" y="270" text-anchor="middle" class="s">HBM capacity / BW</text>
<rect x="705" y="185" width="270" height="120" class="box" fill="#eaf5ee" stroke="#4a9b69"/><text x="840" y="233" text-anchor="middle" class="t">TP / DP / EP</text><text x="840" y="270" text-anchor="middle" class="s">ICI collectives</text>
<rect x="1050" y="185" width="240" height="120" class="box" fill="#eeeafd" stroke="#745ec2"/><text x="1170" y="233" text-anchor="middle" class="t">Pod scaling</text><text x="1170" y="270" text-anchor="middle" class="s">OCS / topology</text>
<rect x="1365" y="185" width="170" height="120" class="box" fill="#fbeeea" stroke="#bd6545"/><text x="1450" y="233" text-anchor="middle" class="t">Cross-slice</text><text x="1450" y="270" text-anchor="middle" class="s">DCN</text>
<path d="M315 245H390" class="arr"/><path d="M630 245H705" class="arr"/><path d="M975 245H1050" class="arr"/><path d="M1290 245H1365" class="arr"/>
<text x="75" y="430" class="t">Long-context decode / serving</text>
<rect x="75" y="465" width="240" height="120" class="box" fill="#e6f2ff" stroke="#4b8fd3"/><text x="195" y="513" text-anchor="middle" style="font-size:20px;font-weight:700">Small GEMM / vector</text><text x="195" y="550" text-anchor="middle" class="s">MXU underfill</text>
<rect x="390" y="465" width="240" height="120" class="box" fill="#fff0dc" stroke="#d98a25"/><text x="510" y="513" text-anchor="middle" class="t">KV / weight traffic</text><text x="510" y="550" text-anchor="middle" class="s">VMEM / HBM pressure</text>
<rect x="705" y="465" width="270" height="120" class="box" fill="#f6eafa" stroke="#9a55aa"/><text x="840" y="513" text-anchor="middle" class="t">reduction / sync</text><text x="840" y="550" text-anchor="middle" class="s">CAE (TPU 8i)</text>
<rect x="1050" y="465" width="240" height="120" class="box" fill="#eaf5ee" stroke="#4a9b69"/><text x="1170" y="513" text-anchor="middle" class="t">Low-tail comms</text><text x="1170" y="550" text-anchor="middle" class="s">Boardfly (8i)</text>
<rect x="1365" y="465" width="170" height="120" class="box" fill="#edf0f2" stroke="#6b7b86"/><text x="1450" y="513" text-anchor="middle" class="t">Host</text><text x="1450" y="550" text-anchor="middle" class="s">scheduling / I/O</text>
<path d="M315 525H390" class="arr"/><path d="M630 525H705" class="arr"/><path d="M975 525H1050" class="arr"/><path d="M1290 525H1365" class="arr"/>
<rect x="135" y="680" width="1330" height="105" class="box" fill="#fff" stroke="#8196a5"/><text x="800" y="725" text-anchor="middle" class="t">Training optimizes sustained throughput; decode exposes traffic, sync, and tail latency</text><text x="800" y="762" text-anchor="middle" class="n">This motivates the 8t / 8i split; both remain pre-GA public roadmaps as of 2026-09-09</text>
</svg>
