<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
<defs><style>text{font-family:Arial,sans-serif;fill:#183044}.h{font-size:34px;font-weight:700}.t{font-size:23px;font-weight:700}.s{font-size:18px}.n{font-size:16px;fill:#5b7182}.box{rx:16;stroke-width:3}.dash{stroke:#8296a4;stroke-width:3;stroke-dasharray:10 10}</style></defs>
<rect width="1600" height="880" fill="#f8fbfd"/><text x="800" y="58" text-anchor="middle" class="h">Google TPU to NVIDIA: keep the questions, relearn the answers</text><text x="800" y="88" text-anchor="middle" class="n">schematic / not to scale / similar responsibilities do not imply equivalent structures</text>
