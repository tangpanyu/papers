<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500"><rect width="100%" height="100%" fill="white"/><text x="550" y="35" text-anchor="middle" font-family="sans-serif" font-size="23">TPU host / ICI / DCN boundaries</text><text x="550" y="58" text-anchor="middle" font-family="sans-serif" font-size="13">schematic / not to scale / 根据 Google Cloud 官方资料重绘</text><g font-family="sans-serif"><rect x="45" y="120" width="260" height="210" fill="#eee" stroke="#333"/><text x="175" y="155" text-anchor="middle" font-size="18">TPU VM / host</text><text x="175" y="195" text-anchor="middle">CPU + 960 GB RAM</text><text x="175" y="225" text-anchor="middle">224 vCPU / 2 NUMA</text><rect x="410" y="120" width="260" height="210" fill="#eee" stroke="#333"/><text x="540" y="155" text-anchor="middle" font-size="18">4 × TPU7x chips</text><text x="540" y="195" text-anchor="middle">local HBM / compute</text><text x="540" y="225" text-anchor="middle">host attachment:</text><text x="540" y="250" text-anchor="middle">PCIe network*</text><rect x="790" y="90" width="260" height="120" fill="#eee" stroke="#333"/><text x="920" y="130" text-anchor="middle" font-size="18">ICI scale-up</text><text x="920" y="165" text-anchor="middle">1200 GB/s/chip (bidirectional)</text><rect x="790" y="280" width="260" height="120" fill="#eee" stroke="#333"/><text x="920" y="320" text-anchor="middle" font-size="18">DCN scale-out</text><text x="920" y="355" text-anchor="middle">100 Gbps/chip</text><line x1="305" y1="220" x2="410" y2="220" stroke="#333" stroke-width="5"/><line x1="670" y1="160" x2="790" y2="150" stroke="#333" stroke-width="5"/><!-- Route the DCN path below the chip box; a diagonal through the box looked like a host↔TPU attachment and was easy to misread at small render sizes. --><path d="M175 330 V365 H745 V340 H790" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"/><text x="500" y="385" text-anchor="middle" font-size="12">DCN / scale-out</text><text x="550" y="438" text-anchor="middle" font-size="13">* TPU7x 正文只写 PCIe network；Ironwood package 图标注 host Gen5 x16 / management Gen2 x1。</text><text x="550" y="458" text-anchor="middle" font-size="13">聚合/有效带宽、lane mapping/affinity 与编码仍未在正文披露。</text><text x="550" y="480" text-anchor="middle" font-size="13">ICI ≠ host network；DCN ≠ device-local HBM↔VMEM path。</text></g></svg>
