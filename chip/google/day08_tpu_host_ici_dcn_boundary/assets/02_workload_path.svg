<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420"><rect width="100%" height="100%" fill="white"/><text x="550" y="35" text-anchor="middle" font-family="sans-serif" font-size="23">Steady-state AI workload data path</text><text x="550" y="58" text-anchor="middle" font-family="sans-serif" font-size="13">schematic / not to scale / 根据 Google Cloud 官方资料重绘</text><g font-family="sans-serif"><rect x="40" y="130" width="190" height="80" fill="#eee" stroke="#333"/><text x="135" y="178" text-anchor="middle">storage/service</text><rect x="305" y="130" width="190" height="80" fill="#eee" stroke="#333"/><text x="400" y="178" text-anchor="middle">host RAM</text><rect x="570" y="130" width="190" height="80" fill="#eee" stroke="#333"/><text x="665" y="178" text-anchor="middle">TPU HBM</text><rect x="835" y="130" width="220" height="80" fill="#eee" stroke="#333"/><text x="945" y="178" text-anchor="middle">peer TPU HBM</text><line x1="230" y1="170" x2="305" y2="170" stroke="#333" stroke-width="4"/><text x="267" y="150" text-anchor="middle" font-size="12">DCN</text><line x1="495" y1="170" x2="570" y2="170" stroke="#333" stroke-width="4"/><text x="532" y="150" text-anchor="middle" font-size="12">PCIe network</text><line x1="760" y1="170" x2="835" y2="170" stroke="#333" stroke-width="4"/><text x="797" y="150" text-anchor="middle" font-size="12">ICI</text><text x="550" y="300" text-anchor="middle" font-size="16">Keep hot model/state in TPU HBM; use ICI for model-parallel exchange.</text><text x="550" y="335" text-anchor="middle" font-size="14">Do not put host RAM in the inner-loop TP path unless the design explicitly requires it.</text></g></svg>
