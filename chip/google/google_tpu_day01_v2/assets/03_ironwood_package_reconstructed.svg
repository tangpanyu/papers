<rect x="520" y="620" width="95" height="60" class="compute"/><text x="535" y="655" class="small">SparseCore</text>
<g class="small">
<rect x="625" y="620" width="58" height="60" class="mem"/><text x="632" y="655">HBM3</text>
<rect x="690" y="620" width="58" height="60" class="mem"/><text x="697" y="655">HBM3</text>
<rect x="755" y="620" width="58" height="60" class="mem"/><text x="762" y="655">HBM3</text>
<rect x="820" y="620" width="58" height="60" class="mem"/><text x="827" y="655">HBM3</text>
</g>
<g class="small">
<rect x="625" y="720" width="58" height="55" class="mem"/><text x="629" y="751">stack</text>
<rect x="690" y="720" width="58" height="55" class="mem"/><text x="694" y="751">stack</text>
<rect x="755" y="720" width="58" height="55" class="mem"/><text x="759" y="751">stack</text>
<rect x="820" y="720" width="58" height="55" class="mem"/><text x="824" y="751">stack</text>
</g>

<!-- logic chiplet B -->
<rect x="950" y="165" width="560" height="650" class="logic"/>
<text x="975" y="195" class="h">Logic chiplet B · 1 TensorCore + 2 SparseCore + 96 GB HBM</text>
<rect x="1000" y="225" width="460" height="235" class="compute"/>
<text x="1025" y="255" class="h">TensorCore</text>
<rect x="1175" y="275" width="110" height="60" class="compute"/><text x="1210" y="312" class="t">TCS</text>
<rect x="1040" y="340" width="90" height="55" class="compute"/><text x="1065" y="373" class="t">XLU</text>
<rect x="1340" y="340" width="90" height="55" class="compute"/><text x="1365" y="373" class="t">XLU</text>
<rect x="1040" y="410" width="90" height="55" class="compute"/><text x="1065" y="443" class="t">MXU</text>
