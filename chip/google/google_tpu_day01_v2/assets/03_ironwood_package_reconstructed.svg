<rect x="1175" y="345" width="110" height="120" class="compute"/><text x="1203" y="397" class="t">VPU +</text><text x="1205" y="425" class="t">VMEM</text>
<rect x="995" y="495" width="470" height="90" class="mem"/><text x="1100" y="547" class="h">Memory &amp; DMA Interconnect</text>
<rect x="1000" y="620" width="95" height="60" class="compute"/><text x="1015" y="655" class="small">SparseCore</text>
<rect x="1105" y="620" width="95" height="60" class="compute"/><text x="1120" y="655" class="small">SparseCore</text>
<g class="small">
<rect x="1210" y="620" width="58" height="60" class="mem"/><text x="1217" y="655">HBM3</text>
<rect x="1275" y="620" width="58" height="60" class="mem"/><text x="1282" y="655">HBM3</text>
<rect x="1340" y="620" width="58" height="60" class="mem"/><text x="1347" y="655">HBM3</text>
<rect x="1405" y="620" width="58" height="60" class="mem"/><text x="1412" y="655">HBM3</text>
</g>
<g class="small">
<rect x="1210" y="720" width="58" height="55" class="mem"/><text x="1214" y="751">stack</text>
<rect x="1275" y="720" width="58" height="55" class="mem"/><text x="1279" y="751">stack</text>
<rect x="1340" y="720" width="58" height="55" class="mem"/><text x="1344" y="751">stack</text>
<rect x="1405" y="720" width="58" height="55" class="mem"/><text x="1409" y="751">stack</text>
</g>

<!-- D2D -->
<line x1="925" y1="535" x2="950" y2="535" class="bi"/>
<text x="855" y="445" class="small">D2D: ~6× bandwidth of one 1D ICI link</text>

<!-- serdes -->
<rect x="1535" y="285" width="165" height="390" class="serdes"/>
<text x="1565" y="318" class="h">SerDes chiplet</text>
<rect x="1560" y="355" width="115" height="90" class="inter"/><text x="1587" y="395" class="t">ICI / ICR</text><text x="1593" y="420" class="small">router</text>
<rect x="1560" y="475" width="115" height="85" class="inter"/><text x="1580" y="515" class="t">6× link</text><text x="1592" y="538" class="small">stack</text>
<rect x="1560" y="590" width="115" height="60" class="serdes"/><text x="1572" y="625" class="small">6×112G SerDes</text>
<line x1="1465" y1="540" x2="1535" y2="540" class="bi"/>
<!-- host / management paths shown schematically, following official figure -->
<path d="M140 425 V495 H410" fill="none" class="bi"/>
<path d="M275 425 V545 H310" fill="none" class="bi"/>
<path d="M310 587 H365 V545 H410" fill="none" class="bi"/>

<text x="70" y="860" class="small">注 1：Google 官方图把每个 compute chiplet 画成独立 memory space；本文按官方文字标注每个 chiplet = 1 TensorCore + 2 SparseCores + 96 GB HBM。</text>
<text x="70" y="888" class="small">注 2：本图用于教学，未尝试还原版图位置、总线位宽或真实物理 floorplan；未公开细节不推断。</text>
</svg>