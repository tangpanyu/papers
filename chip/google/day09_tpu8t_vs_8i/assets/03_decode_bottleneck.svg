<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600">
<rect width="100%" height="100%" fill="white"/>
<text x="640" y="38" text-anchor="middle" font-family="sans-serif" font-size="27">Why 8i spends silicon on SRAM + CAE + Boardfly</text>
<text x="640" y="64" text-anchor="middle" font-family="sans-serif" font-size="13">schematic / not to scale / 根据 Google Cloud 官方资料重绘</text>
<g font-family="sans-serif">
<rect x="60" y="165" width="230" height="120" fill="#eee" stroke="#333"/><text x="175" y="205" text-anchor="middle" font-size="19">long-context decode</text><text x="175" y="240" text-anchor="middle">repeated KV/state access</text>
<rect x="385" y="120" width="230" height="120" fill="#eee" stroke="#333"/><text x="500" y="160" text-anchor="middle" font-size="19">384 MB VMEM</text><text x="500" y="195" text-anchor="middle">more hot KV on-chip</text>
<rect x="385" y="320" width="230" height="120" fill="#eee" stroke="#333"/><text x="500" y="360" text-anchor="middle" font-size="19">CAE</text><text x="500" y="395" text-anchor="middle">low-latency reductions</text>
<rect x="710" y="220" width="230" height="120" fill="#eee" stroke="#333"/><text x="825" y="260" text-anchor="middle" font-size="19">Boardfly</text><text x="825" y="295" text-anchor="middle">fewer network hops</text>
<rect x="1030" y="220" width="190" height="120" fill="#eee" stroke="#333"/><text x="1125" y="260" text-anchor="middle" font-size="19">lower tail latency</text><text x="1125" y="295" text-anchor="middle">higher serving throughput</text>
<line x1="290" y1="210" x2="385" y2="180" stroke="#333" stroke-width="4"/><line x1="290" y1="240" x2="385" y2="380" stroke="#333" stroke-width="4"/>
<line x1="615" y1="180" x2="710" y2="250" stroke="#333" stroke-width="4"/><line x1="615" y1="380" x2="710" y2="300" stroke="#333" stroke-width="4"/>
<line x1="940" y1="280" x2="1030" y2="280" stroke="#333" stroke-width="4"/>
<text x="640" y="520" text-anchor="middle" font-size="16">Inference specialization targets exposed latency, not just peak FLOPs.</text>
</g></svg>