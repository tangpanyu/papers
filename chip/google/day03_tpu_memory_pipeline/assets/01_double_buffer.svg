<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400"><rect width="100%" height="100%" fill="white"/><text x="500" y="35" text-anchor="middle" font-family="sans-serif" font-size="22">HBM → VMEM Double Buffer Pipeline</text><text x="500" y="58" text-anchor="middle" font-family="sans-serif" font-size="13">schematic / not to scale / based on JAX Pallas docs</text><rect x="50" y="100" width="150" height="80" fill="#eee" stroke="#333"/><text x="125" y="147" text-anchor="middle" font-family="sans-serif" font-size="20">HBM</text><rect x="320" y="80" width="210" height="60" fill="#eee" stroke="#333"/><text x="425" y="117" text-anchor="middle" font-family="sans-serif" font-size="17">VMEM A: tile N</text><rect x="320" y="165" width="210" height="60" fill="#eee" stroke="#333"/><text x="425" y="202" text-anchor="middle" font-family="sans-serif" font-size="17">VMEM B: tile N+1</text><rect x="700" y="100" width="240" height="80" fill="#eee" stroke="#333"/><text x="820" y="147" text-anchor="middle" font-family="sans-serif" font-size="17">VREG → MXU / VPU</text><line x1="200" y1="140" x2="315" y2="192" stroke="#333" stroke-width="3"/><text x="215" y="205" font-family="sans-serif" font-size="13">DMA prefetch</text><line x1="530" y1="110" x2="695" y2="140" stroke="#333" stroke-width="3"/><text x="575" y="105" font-family="sans-serif" font-size="13">compute</text><text x="500" y="285" text-anchor="middle" font-family="sans-serif" font-size="17">k: compute A while DMA fills B</text><text x="500" y="320" text-anchor="middle" font-family="sans-serif" font-size="17">k+1: compute B while DMA refills A</text><text x="500" y="365" text-anchor="middle" font-family="sans-serif" font-size="15">steady state goal: max(Tcopy, Tcompute)</text></svg>
