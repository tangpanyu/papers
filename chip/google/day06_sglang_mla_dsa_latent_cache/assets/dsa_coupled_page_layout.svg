<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <style>
      .title{font:700 34px 'DejaVu Sans',Arial,sans-serif;fill:#172033}
      .section{font:700 24px 'DejaVu Sans',Arial,sans-serif;fill:#25324a}
      .label{font:600 20px 'DejaVu Sans',Arial,sans-serif;fill:#172033}
      .body{font:400 18px 'DejaVu Sans',Arial,sans-serif;fill:#34415b}
      .mono{font:500 17px 'DejaVu Sans Mono',monospace;fill:#26344d}
      .small{font:400 15px 'DejaVu Sans',Arial,sans-serif;fill:#526079}
      .meta{fill:none;stroke:#3478d4;stroke-width:3;stroke-dasharray:11 8;marker-end:url(#arrowBlue)}
      .data{fill:none;stroke:#e26055;stroke-width:4;marker-end:url(#arrowRed)}
      .life{fill:none;stroke:#2b9a70;stroke-width:3;marker-end:url(#arrowGreen)}
    </style>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3478d4"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e26055"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2b9a70"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#23304a" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1800" height="760" fill="#f7f9fc"/>
  <text x="55" y="58" class="title">DSA invariant: latent main page and indexer-K page share one physical coordinate</text>
  <text x="55" y="91" class="small">Self-drawn summary · teaching geometry: page_size=64, r=512, s=64, BF16 latent, index_head_dim=128 · per-layer values</text>

  <rect x="55" y="130" width="430" height="220" rx="20" fill="#eaf4ff" stroke="#72a9df" stroke-width="2" filter="url(#shadow)"/>
  <text x="85" y="170" class="section">Logical address</text>
  <text x="85" y="210" class="label">ReqToTokenPool row 23</text>
  <text x="85" y="247" class="mono">pos 0..63  → loc 704..767</text>
  <text x="85" y="278" class="mono">pos 64     → loc 2624</text>
  <text x="85" y="309" class="mono">pos 65     → loc 2625</text>
  <text x="85" y="335" class="small">page = loc // 64；offset = loc % 64</text>

  <rect x="565" y="130" width="535" height="475" rx="20" fill="#fff5f2" stroke="#e8988f" stroke-width="2" filter="url(#shadow)"/>
  <text x="595" y="170" class="section">Latent main pool · physical page 41</text>
  <text x="595" y="203" class="mono">view: [64, 1, 576] bfloat16</text>
  <text x="595" y="232" class="body">per token = (512 + 64) × 2 B = 1152 B</text>
  <text x="595" y="261" class="body">per page / layer = 64 × 1152 B = 72 KiB</text>
  <rect x="610" y="295" width="440" height="50" rx="8" fill="#ffdcd7" stroke="#e8988f"/>
  <text x="630" y="326" class="mono">offset 0 · cᵏᵛ[512] | kᴿ[64]</text>
  <rect x="610" y="353" width="440" height="50" rx="8" fill="#ffe9e5" stroke="#e8988f"/>
  <text x="630" y="384" class="mono">offset 1 · cᵏᵛ[512] | kᴿ[64]</text>
  <rect x="610" y="411" width="440" height="50" rx="8" fill="#f4f5f7" stroke="#c5cad3"/>
  <text x="630" y="442" class="mono">offset 2 … 62 · unwritten / stale</text>
  <rect x="610" y="469" width="440" height="50" rx="8" fill="#f4f5f7" stroke="#c5cad3"/>
  <text x="630" y="500" class="mono">offset 63 · unwritten / stale</text>
  <text x="610" y="556" class="small">flat tensor [C+P,1,576] can be viewed as pages;</text>
  <text x="610" y="582" class="small">out_cache_loc selects writes; requests own no tensor.</text>

  <rect x="1180" y="130" width="565" height="475" rx="20" fill="#f2edff" stroke="#9e88df" stroke-width="2" filter="url(#shadow)"/>
  <text x="1210" y="170" class="section">indexer sidecar · physical page 41</text>
  <text x="1210" y="203" class="mono">tensor: [Npages, 64 × 132] uint8</text>
  <text x="1210" y="232" class="body">logical token = FP8 key[128] + FP32 scale[1]</text>
  <text x="1210" y="261" class="body">per page / layer = 64 × 132 B = 8.25 KiB</text>
  <rect x="1225" y="295" width="470" height="50" rx="8" fill="#ded5ff" stroke="#9e88df"/>
  <text x="1245" y="326" class="mono">offset 0 · index_k[128 B] | scale[4 B]</text>
  <rect x="1225" y="353" width="470" height="50" rx="8" fill="#ebe5ff" stroke="#9e88df"/>
  <text x="1245" y="384" class="mono">offset 1 · index_k[128 B] | scale[4 B]</text>
  <rect x="1225" y="411" width="470" height="50" rx="8" fill="#f4f5f7" stroke="#c5cad3"/>
  <text x="1245" y="442" class="mono">offset 2 … 62 · unwritten / stale</text>
  <rect x="1225" y="469" width="470" height="50" rx="8" fill="#f4f5f7" stroke="#c5cad3"/>
  <text x="1245" y="500" class="mono">offset 63 · unwritten / stale</text>
  <text x="1225" y="556" class="small">same out_cache_loc=2624+i means page 41 / offset i;</text>
  <text x="1225" y="582" class="small">RadixCache needs no second indexer mapping.</text>

  <path d="M485 260 C525 260,530 320,565 320" class="meta"/>
  <path d="M485 290 C800 680,1400 680,1460 610" class="meta"/>
  <path d="M1100 380 L1180 380" class="data"/>
  <text x="1080" y="365" class="small">same loc</text>

  <rect x="205" y="420" width="280" height="115" rx="15" fill="#effaf4" stroke="#67b98f" stroke-width="2"/>
  <text x="230" y="453" class="label">One lifecycle</text>
  <text x="230" y="484" class="body">allocate / lock / cache</text>
  <text x="230" y="512" class="body">evict / reuse by one page ID</text>
  <path d="M485 475 C530 475,530 480,565 480" class="life"/>
  <path d="M485 500 C810 675,1395 675,1460 610" class="life"/>

  <rect x="250" y="650" width="1300" height="66" rx="15" fill="#ffffff" stroke="#c5cad3" stroke-width="2"/>
  <text x="285" y="680" class="label">One allocator only:</text>
  <text x="515" y="680" class="body">capacity / move / free / page-size must align, or a prefix hit can read another generation.</text>
  <text x="500" y="706" class="small">The sidecar joins sizing and shares loc generations; top-k output lives for one forward only.</text>
</svg>
