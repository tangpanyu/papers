<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#344f63"/></marker><style>text{font-family:Arial,sans-serif;fill:#183044}.h{font-size:36px;font-weight:700}.t{font-size:24px;font-weight:700}.s{font-size:18px}.n{font-size:16px;fill:#5c7180}.box{rx:18;stroke-width:3}.arr{stroke:#344f63;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#7f939f;stroke-width:3;stroke-dasharray:10 10;fill:none}</style></defs>
<rect width="1700" height="900" fill="#f7fafc"/><text x="850" y="58" text-anchor="middle" class="h">One all-reduce, three physical tiers</text><text x="850" y="88" text-anchor="middle" class="n">schematic / not to scale / NCCL algorithm and channel choices depend on discovered topology and message size</text>
<rect x="90" y="155" width="430" height="520" class="box" fill="#eaf5ee" stroke="#4a9b69"/><text x="305" y="200" text-anchor="middle" class="t">Local GPU / HBM</text><rect x="145" y="245" width="320" height="95" class="box" fill="#fff" stroke="#4a9b69"/><text x="305" y="285" text-anchor="middle" class="t">reduce / copy kernels</text><text x="305" y="315" text-anchor="middle" class="s">SM, L2, HBM traffic</text><rect x="145" y="405" width="320" height="95" class="box" fill="#fff" stroke="#4a9b69"/><text x="305" y="445" text-anchor="middle" class="t">local chunks</text><text x="305" y="475" text-anchor="middle" class="s">GPU memory ownership</text><path d="M305 340V405" class="arr"/>
<rect x="635" y="155" width="430" height="520" class="box" fill="#f0ecfd" stroke="#745ec2"/><text x="850" y="200" text-anchor="middle" class="t">Scale-up domain</text><rect x="690" y="245" width="320" height="95" class="box" fill="#fff" stroke="#745ec2"/><text x="850" y="285" text-anchor="middle" class="t">NVLink / NVSwitch</text><text x="850" y="315" text-anchor="middle" class="s">peer GPU load/store path</text><rect x="690" y="405" width="320" height="95" class="box" fill="#fff" stroke="#745ec2"/><text x="850" y="445" text-anchor="middle" class="t">NVLS (when selected)</text><text x="850" y="475" text-anchor="middle" class="s">switch-assisted reduction</text><path d="M850 340V405" class="arr"/>
<rect x="1180" y="155" width="430" height="520" class="box" fill="#fff0dc" stroke="#d78a25"/><text x="1395" y="200" text-anchor="middle" class="t">Scale-out domain</text><rect x="1235" y="245" width="320" height="95" class="box" fill="#fff" stroke="#d78a25"/><text x="1395" y="285" text-anchor="middle" class="t">NIC + RDMA</text><text x="1395" y="315" text-anchor="middle" class="s">PCIe peer-memory DMA</text><rect x="1235" y="405" width="320" height="95" class="box" fill="#fff" stroke="#d78a25"/><text x="1395" y="445" text-anchor="middle" class="t">IB / Ethernet fabric</text><text x="1395" y="475" text-anchor="middle" class="s">remote rank communication</text><path d="M1395 340V405" class="arr"/>
<path d="M520 370H635" class="arr"/><path d="M1065 370H1180" class="arr"/><text x="578" y="350" text-anchor="middle" class="n">peer path</text><text x="1123" y="350" text-anchor="middle" class="n">NIC path</text>
<path d="M305 675V760H1395V675" class="dash"/><text x="850" y="800" text-anchor="middle" class="t">A collective API does not imply one homogeneous network</text><text x="850" y="835" text-anchor="middle" class="s">The runtime decomposes work across local memory, scale-up, and scale-out tiers</text>
</svg>
