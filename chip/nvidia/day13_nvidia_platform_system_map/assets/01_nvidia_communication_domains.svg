<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#344f63"/></marker><style>text{font-family:Arial,sans-serif;fill:#183044}.h{font-size:36px;font-weight:700}.t{font-size:25px;font-weight:700}.s{font-size:19px}.n{font-size:16px;fill:#5c7180}.box{rx:18;stroke-width:3}.arr{stroke:#344f63;stroke-width:4;fill:none;marker-end:url(#a)}.bi{stroke:#344f63;stroke-width:4;fill:none;marker-start:url(#a);marker-end:url(#a)}</style></defs>
<rect width="1700" height="980" fill="#f7fafc"/><text x="850" y="58" text-anchor="middle" class="h">NVIDIA platform: six communication domains</text><text x="850" y="88" text-anchor="middle" class="n">schematic / not to scale / product wiring varies; GPU internal fabric and routing not disclosed here</text>
<rect x="55" y="130" width="1590" height="205" class="box" fill="#fff" stroke="#97a8b4"/><text x="85" y="166" class="t">1. GPU-local memory domain</text>
<rect x="100" y="195" width="260" height="100" class="box" fill="#e6f2ff" stroke="#4b8fd3"/><text x="230" y="236" text-anchor="middle" class="t">SM clusters</text><text x="230" y="268" text-anchor="middle" class="s">register / L1 / shared</text>
<rect x="470" y="195" width="270" height="100" class="box" fill="#eef4f7" stroke="#698292"/><text x="605" y="236" text-anchor="middle" class="t">L2 + partitions</text><text x="605" y="268" text-anchor="middle" class="s">on-chip fabric boundary</text>
<rect x="850" y="195" width="260" height="100" class="box" fill="#fff0dc" stroke="#d78a25"/><text x="980" y="236" text-anchor="middle" class="t">HBM</text><text x="980" y="268" text-anchor="middle" class="s">GPU physical memory</text>
<path d="M360 245H470" class="bi"/><path d="M740 245H850" class="bi"/>
<rect x="55" y="380" width="1590" height="205" class="box" fill="#fff" stroke="#97a8b4"/><text x="85" y="416" class="t">2-4. Node / rack scale-up and host I/O</text>
<rect x="100" y="445" width="260" height="100" class="box" fill="#eaf5ee" stroke="#4a9b69"/><text x="230" y="486" text-anchor="middle" class="t">GPU A HBM</text><text x="230" y="518" text-anchor="middle" class="s">CUDA addressable memory</text>
<rect x="440" y="445" width="280" height="100" class="box" fill="#f0ecfd" stroke="#745ec2"/><text x="580" y="486" text-anchor="middle" class="t">NVLink / NVSwitch</text><text x="580" y="518" text-anchor="middle" class="s">GPU scale-up domain</text>
<rect x="800" y="445" width="250" height="100" class="box" fill="#eaf5ee" stroke="#4a9b69"/><text x="925" y="486" text-anchor="middle" class="t">GPU B HBM</text><text x="925" y="518" text-anchor="middle" class="s">peer memory</text>
<rect x="1130" y="445" width="200" height="100" class="box" fill="#edf0f2" stroke="#697985"/><text x="1230" y="486" text-anchor="middle" class="t">PCIe fabric</text><text x="1230" y="518" text-anchor="middle" class="s">I/O + DMA</text>
<rect x="1410" y="445" width="180" height="100" class="box" fill="#fbeeea" stroke="#bd6545"/><text x="1500" y="486" text-anchor="middle" class="t">CPU DRAM</text><text x="1500" y="518" text-anchor="middle" class="s">host memory</text>
<path d="M360 495H440" class="bi"/><path d="M720 495H800" class="bi"/><path d="M1050 495H1130" class="bi"/><path d="M1330 495H1410" class="bi"/>
<text x="580" y="570" text-anchor="middle" class="n">NVLink-C2C may replace the CPU-GPU PCIe data path in Grace-based products; it is a distinct coherent package link</text>
<rect x="55" y="630" width="1590" height="205" class="box" fill="#fff" stroke="#97a8b4"/><text x="85" y="666" class="t">5-6. GPU-to-NIC path and scale-out network</text>
<rect x="100" y="695" width="260" height="100" class="box" fill="#eaf5ee" stroke="#4a9b69"/><text x="230" y="736" text-anchor="middle" class="t">GPU HBM</text><text x="230" y="768" text-anchor="middle" class="s">registered peer buffer</text>
<rect x="440" y="695" width="220" height="100" class="box" fill="#edf0f2" stroke="#697985"/><text x="550" y="736" text-anchor="middle" class="t">PCIe / DMA</text><text x="550" y="768" text-anchor="middle" class="s">GPUDirect RDMA path</text>
<rect x="740" y="695" width="260" height="100" class="box" fill="#e6f2ff" stroke="#4b8fd3"/><text x="870" y="736" text-anchor="middle" class="t">ConnectX / DPU</text><text x="870" y="768" text-anchor="middle" class="s">NIC / HCA endpoint</text>
<rect x="1080" y="695" width="250" height="100" class="box" fill="#fff0dc" stroke="#d78a25"/><text x="1205" y="736" text-anchor="middle" class="t">IB / Ethernet switch</text><text x="1205" y="768" text-anchor="middle" class="s">scale-out fabric</text>
<rect x="1410" y="695" width="180" height="100" class="box" fill="#f6eafa" stroke="#9a55aa"/><text x="1500" y="736" text-anchor="middle" class="t">Remote GPU</text><text x="1500" y="768" text-anchor="middle" class="s">another node/rack</text>
<path d="M360 745H440" class="bi"/><path d="M660 745H740" class="bi"/><path d="M1000 745H1080" class="bi"/><path d="M1330 745H1410" class="bi"/>
<rect x="170" y="875" width="1360" height="65" class="box" fill="#fff" stroke="#8296a4"/><text x="850" y="916" text-anchor="middle" class="t">NVLink is scale-up; InfiniBand/Ethernet is scale-out; PCIe is the shared I/O substrate between domains</text>
</svg>
