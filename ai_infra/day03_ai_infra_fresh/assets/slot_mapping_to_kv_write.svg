<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" role="img" aria-labelledby="title desc">
<title id="title">slot_mapping 到 KV cache 写入的逻辑流程</title>
<desc id="desc">Scheduler 和 BlockTable 生成 slot_mapping，随后由 reshape/cache kernel 写入 Paged KV Cache。</desc>
<style>
  /* Dark is the safe fallback: it remains readable when the host editor only
     changes its canvas (as Typora/VS Code can do without changing SVG media). */
  text { fill: #f0f6fc; }
  .b { fill: #262c36; stroke: #8b949e; }
  .a { stroke: #8b949e; }
  .h { stroke: #1d2228; }
  .t { fill: #f0f6fc; }
  .n { fill: #c9d1d9; stroke: #1d2228; }
  /* On a light OS/editor theme, retain the usual light diagram palette. */
  @media (prefers-color-scheme: light) {
    text { fill: #1f2328; }
    .b { fill: #fafafa; stroke: #57606a; }
    .a { stroke: #57606a; }
    .h { stroke: #ffffff; }
    .t { fill: #1f2328; }
    .n { fill: #424a53; stroke: #ffffff; }
  }
  text { font-family: Arial, sans-serif; }
  .b { stroke-width: 2; }
  .a { stroke-width: 2.5; }
  .h { font-size: 20px; font-weight: bold; paint-order: stroke; stroke-width: 3px; }
  .t { font-size: 15px; }
  .n { font-size: 15px; paint-order: stroke; stroke-width: 2px; }
</style>
<text x="25" y="30" class="h">slot_mapping → KV cache write（逻辑流程示意）</text>
<rect x="25" y="85" width="190" height="65" rx="8" class="b"/><text x="43" y="122" class="t">Scheduler / BlockTable</text>
<rect x="275" y="85" width="165" height="65" rx="8" class="b"/><text x="310" y="122" class="t">slot_mapping</text>
<rect x="500" y="85" width="205" height="65" rx="8" class="b"/><text x="530" y="122" class="t">reshape/cache kernel</text>
<rect x="765" y="85" width="205" height="65" rx="8" class="b"/><text x="805" y="122" class="t">Paged KV Cache</text>
<line x1="215" y1="118" x2="275" y2="118" class="a"/><line x1="440" y1="118" x2="500" y2="118" class="a"/><line x1="705" y1="118" x2="765" y2="118" class="a"/>
<text x="490" y="205" class="n">slot → block_idx / block_offset → stride address → store K/V</text>
</svg>
