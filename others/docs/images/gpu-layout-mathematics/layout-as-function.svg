<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Layout 是坐标空间之间的函数</title>
  <desc id="desc">上半部分展示输入坐标经过 Shape、Stride 和 Accessor 得到张量元素；下半部分列出内存布局、线程所有权和循环访问三个同构例子。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 16px; fill: #475569; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; font-size: 18px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="650" rx="26" fill="url(#bg)"/>
  <text x="750" y="55" text-anchor="middle" class="title">Layout 不是一块数据：它首先是一条函数链</text>

  <g>
    <rect x="55" y="105" width="260" height="135" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="185" y="151" text-anchor="middle" class="head">输入坐标 c</text>
    <text x="185" y="187" text-anchor="middle" class="body">c ∈ Z(P)，P ⪯ S</text>
    <text x="185" y="217" text-anchor="middle" class="small">整数、普通 tuple 或 HTuple</text>

    <rect x="430" y="105" width="280" height="135" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text x="570" y="151" text-anchor="middle" class="head">自然坐标 c_nat = S(c)</text>
    <text x="570" y="187" text-anchor="middle" class="body">c_nat 与 Shape S 同 profile</text>
    <text x="570" y="217" text-anchor="middle" class="small">idx2crd / mixed radix</text>

    <rect x="825" y="105" width="260" height="135" rx="18" fill="#dcfce7" stroke="#10b981" stroke-width="3"/>
    <text x="955" y="151" text-anchor="middle" class="head">索引 y = D · c_nat</text>
    <text x="955" y="187" text-anchor="middle" class="body">y ∈ codomain(D)</text>
    <text x="955" y="217" text-anchor="middle" class="small">inner_product / stride</text>

    <rect x="1200" y="105" width="245" height="135" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <text x="1322" y="151" text-anchor="middle" class="head">对象 e(y)</text>
    <text x="1322" y="187" text-anchor="middle" class="body">内存元素或资源</text>
    <text x="1322" y="217" text-anchor="middle" class="small">Accessor after Layout</text>

    <path class="arrow" d="M315 172 H425"/>
    <text x="370" y="151" text-anchor="middle" class="small">Shape S</text>
    <path class="arrow" d="M710 172 H820"/>
    <text x="765" y="151" text-anchor="middle" class="small">Stride D</text>
    <path class="arrow" d="M1085 172 H1195"/>
    <text x="1140" y="151" text-anchor="middle" class="small">Accessor e</text>
  </g>

  <rect x="55" y="280" width="1390" height="3" fill="#cbd5e1"/>
  <text x="750" y="327" text-anchor="middle" class="head">同一套语言覆盖三类 GPU / 编译器问题</text>

  <g>
    <rect x="70" y="365" width="410" height="215" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
    <text x="275" y="410" text-anchor="middle" class="head">数据布局</text>
    <text x="275" y="454" text-anchor="middle" class="mono">(m, n) ──L──▶ offset</text>
    <text x="275" y="495" text-anchor="middle" class="body">逻辑矩阵坐标 → 物理地址偏移</text>
    <text x="275" y="532" text-anchor="middle" class="small">row-major、padding、interleave、swizzle</text>

    <rect x="545" y="365" width="410" height="215" rx="20" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
    <text x="750" y="410" text-anchor="middle" class="head">硬件所有权</text>
    <text x="750" y="454" text-anchor="middle" class="mono">(reg, lane, warp) ──T──▶ (m, n)</text>
    <text x="750" y="495" text-anchor="middle" class="body">硬件坐标 → tensor 元素坐标</text>
    <text x="750" y="532" text-anchor="middle" class="small">MMA fragment、thread-value layout</text>

    <rect x="1020" y="365" width="410" height="215" rx="20" fill="#ffffff" stroke="#34d399" stroke-width="3"/>
    <text x="1225" y="410" text-anchor="middle" class="head">循环与访存</text>
    <text x="1225" y="454" text-anchor="middle" class="mono">(i, j) ──A──▶ address</text>
    <text x="1225" y="495" text-anchor="middle" class="body">迭代空间 → 数组下标 / 地址</text>
    <text x="1225" y="532" text-anchor="middle" class="small">affine map、dependence、loop transform</text>
  </g>

  <text x="750" y="625" text-anchor="middle" class="small">核心动作始终是：声明 domain 与 codomain，检查 image，再做 composition / inverse / divide。</text>
</svg>
