<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">单射、满射与双射</title>
  <desc id="desc">三个映射图分别表示无碰撞但有未覆盖目标的单射、有碰撞但覆盖所有目标的满射，以及一一对应的双射。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .head { font-size: 25px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #475569; }
      .node { fill: #fff; stroke-width: 3; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="650" rx="26" fill="#f8fafc"/>
  <text x="750" y="55" text-anchor="middle" class="title">映射的三种覆盖关系：先看 collision，再看 hole</text>

  <g transform="translate(35,90)">
    <rect width="450" height="500" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="225" y="48" text-anchor="middle" class="head">单射 injective（非满射）</text>
    <text x="100" y="91" text-anchor="middle" class="small">domain A</text>
    <text x="350" y="91" text-anchor="middle" class="small">codomain B</text>

    <circle class="node" cx="100" cy="160" r="22" stroke="#2563eb"/><text x="100" y="167" text-anchor="middle" class="body">a₀</text>
    <circle class="node" cx="100" cy="260" r="22" stroke="#2563eb"/><text x="100" y="267" text-anchor="middle" class="body">a₁</text>
    <circle class="node" cx="100" cy="360" r="22" stroke="#2563eb"/><text x="100" y="367" text-anchor="middle" class="body">a₂</text>

    <circle class="node" cx="350" cy="140" r="22" stroke="#10b981"/><text x="350" y="147" text-anchor="middle" class="body">b₀</text>
    <circle class="node" cx="350" cy="220" r="22" stroke="#10b981"/><text x="350" y="227" text-anchor="middle" class="body">b₁</text>
    <circle class="node" cx="350" cy="300" r="22" stroke="#f59e0b"/><text x="350" y="307" text-anchor="middle" class="body">b₂</text>
    <circle class="node" cx="350" cy="380" r="22" stroke="#10b981"/><text x="350" y="387" text-anchor="middle" class="body">b₃</text>

    <path class="edge" d="M124 157 C205 150,270 144,325 141"/>
    <path class="edge" d="M124 257 C205 245,270 230,325 221"/>
    <path class="edge" d="M124 361 C205 368,270 376,325 379"/>
    <text x="225" y="432" text-anchor="middle" class="body">不同输入从不相撞；b₂ 没被覆盖</text>
    <text x="225" y="466" text-anchor="middle" class="small">可有 left inverse；不一定有 full inverse</text>
  </g>

  <g transform="translate(525,90)">
    <rect width="450" height="500" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="225" y="48" text-anchor="middle" class="head">满射 surjective（非单射）</text>
    <text x="100" y="91" text-anchor="middle" class="small">domain A</text>
    <text x="350" y="91" text-anchor="middle" class="small">codomain B</text>

    <circle class="node" cx="100" cy="130" r="22" stroke="#2563eb"/><text x="100" y="137" text-anchor="middle" class="body">a₀</text>
    <circle class="node" cx="100" cy="220" r="22" stroke="#2563eb"/><text x="100" y="227" text-anchor="middle" class="body">a₁</text>
    <circle class="node" cx="100" cy="310" r="22" stroke="#2563eb"/><text x="100" y="317" text-anchor="middle" class="body">a₂</text>
    <circle class="node" cx="100" cy="400" r="22" stroke="#2563eb"/><text x="100" y="407" text-anchor="middle" class="body">a₃</text>

    <circle class="node" cx="350" cy="150" r="22" stroke="#10b981"/><text x="350" y="157" text-anchor="middle" class="body">b₀</text>
    <circle class="node" cx="350" cy="265" r="27" stroke="#ef4444"/><text x="350" y="272" text-anchor="middle" class="body">b₁</text>
    <circle class="node" cx="350" cy="380" r="22" stroke="#10b981"/><text x="350" y="387" text-anchor="middle" class="body">b₂</text>

    <path class="edge" d="M124 132 C205 135,270 144,325 148"/>
    <path class="edge" d="M124 219 C205 225,270 250,322 260"/>
    <path class="edge" d="M124 309 C205 305,270 280,322 270"/>
    <path class="edge" d="M124 398 C205 395,270 386,325 382"/>
    <text x="225" y="432" text-anchor="middle" class="body">所有目标都被覆盖；a₁、a₂ 发生 collision</text>
    <text x="225" y="466" text-anchor="middle" class="small">可选 right inverse；逆映射不唯一</text>
  </g>

  <g transform="translate(1015,90)">
    <rect width="450" height="500" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="225" y="48" text-anchor="middle" class="head">双射 bijective</text>
    <text x="100" y="91" text-anchor="middle" class="small">domain A</text>
    <text x="350" y="91" text-anchor="middle" class="small">codomain B</text>

    <circle class="node" cx="100" cy="130" r="22" stroke="#2563eb"/><text x="100" y="137" text-anchor="middle" class="body">a₀</text>
    <circle class="node" cx="100" cy="220" r="22" stroke="#2563eb"/><text x="100" y="227" text-anchor="middle" class="body">a₁</text>
    <circle class="node" cx="100" cy="310" r="22" stroke="#2563eb"/><text x="100" y="317" text-anchor="middle" class="body">a₂</text>
    <circle class="node" cx="100" cy="400" r="22" stroke="#2563eb"/><text x="100" y="407" text-anchor="middle" class="body">a₃</text>

    <circle class="node" cx="350" cy="130" r="22" stroke="#10b981"/><text x="350" y="137" text-anchor="middle" class="body">b₀</text>
    <circle class="node" cx="350" cy="220" r="22" stroke="#10b981"/><text x="350" y="227" text-anchor="middle" class="body">b₁</text>
    <circle class="node" cx="350" cy="310" r="22" stroke="#10b981"/><text x="350" y="317" text-anchor="middle" class="body">b₂</text>
    <circle class="node" cx="350" cy="400" r="22" stroke="#10b981"/><text x="350" y="407" text-anchor="middle" class="body">b₃</text>

    <path class="edge" d="M124 130 H325"/>
    <path class="edge" d="M124 220 H325"/>
    <path class="edge" d="M124 310 H325"/>
    <path class="edge" d="M124 400 H325"/>
    <text x="225" y="432" text-anchor="middle" class="body">无 collision，也无 hole：一一对应</text>
    <text x="225" y="466" text-anchor="middle" class="small">存在唯一 full inverse</text>
  </g>

  <text x="750" y="625" text-anchor="middle" class="small">判断必须相对于明确的 codomain；只列出 image 而不声明 codomain，不能谈“满射”。</text>
</svg>
