<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">Composition 加 slicing 实现线程分区</title>
  <desc id="desc">线程和值坐标经 thread-value layout 映射到逻辑 tensor 坐标，再经 data layout 映射到 offset，固定 thread 坐标后得到单线程 fragment。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #475569; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; font-size: 18px; }
      .edge { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
      .grid { stroke: #fff; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1500" height="700" rx="26" fill="#f8fafc"/>
  <text x="750" y="55" text-anchor="middle" class="title">GPU 分区的标准范式：compose，再按 thread slice</text>

  <g>
    <rect x="50" y="110" width="280" height="135" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text x="190" y="153" text-anchor="middle" class="head">硬件坐标</text>
    <text x="190" y="191" text-anchor="middle" class="mono">(thr, val)</text>
    <text x="190" y="220" text-anchor="middle" class="small">谁拥有第几个 fragment value</text>

    <rect x="460" y="110" width="280" height="135" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="600" y="153" text-anchor="middle" class="head">逻辑 tensor 坐标</text>
    <text x="600" y="191" text-anchor="middle" class="mono">(m, n)</text>
    <text x="600" y="220" text-anchor="middle" class="small">与存储方式无关的公共空间</text>

    <rect x="870" y="110" width="250" height="135" rx="18" fill="#dcfce7" stroke="#10b981" stroke-width="3"/>
    <text x="995" y="153" text-anchor="middle" class="head">物理索引</text>
    <text x="995" y="191" text-anchor="middle" class="mono">offset</text>
    <text x="995" y="220" text-anchor="middle" class="small">GMEM / SMEM / TMEM</text>

    <rect x="1250" y="110" width="200" height="135" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
    <text x="1350" y="153" text-anchor="middle" class="head">数据</text>
    <text x="1350" y="191" text-anchor="middle" class="mono">e(offset)</text>
    <text x="1350" y="220" text-anchor="middle" class="small">Accessor 解引用</text>

    <path class="edge" d="M330 177 H455"/><text x="392" y="151" text-anchor="middle" class="body">T</text>
    <path class="edge" d="M740 177 H865"/><text x="802" y="151" text-anchor="middle" class="body">A</text>
    <path class="edge" d="M1120 177 H1245"/><text x="1182" y="151" text-anchor="middle" class="body">e</text>

    <path d="M190 265 V305 H995 V265" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <text x="592" y="333" text-anchor="middle" class="head">P(thr,val) = A(T(thr,val)) → offset</text>
  </g>

  <g transform="translate(60,380)">
    <rect width="500" height="250" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="250" y="40" text-anchor="middle" class="head">玩具 ownership 图（4 threads × 4 values）</text>
    <g transform="translate(90,65)">
      <rect x="0" y="0" width="80" height="40" fill="#dbeafe" class="grid"/><text x="40" y="26" text-anchor="middle" class="small">T0·V0</text>
      <rect x="80" y="0" width="80" height="40" fill="#dbeafe" class="grid"/><text x="120" y="26" text-anchor="middle" class="small">T0·V1</text>
      <rect x="160" y="0" width="80" height="40" fill="#dbeafe" class="grid"/><text x="200" y="26" text-anchor="middle" class="small">T0·V2</text>
      <rect x="240" y="0" width="80" height="40" fill="#dbeafe" class="grid"/><text x="280" y="26" text-anchor="middle" class="small">T0·V3</text>
      <rect x="0" y="40" width="80" height="40" fill="#ede9fe" class="grid"/><text x="40" y="66" text-anchor="middle" class="small">T1·V0</text>
      <rect x="80" y="40" width="80" height="40" fill="#ede9fe" class="grid"/><text x="120" y="66" text-anchor="middle" class="small">T1·V1</text>
      <rect x="160" y="40" width="80" height="40" fill="#ede9fe" class="grid"/><text x="200" y="66" text-anchor="middle" class="small">T1·V2</text>
      <rect x="240" y="40" width="80" height="40" fill="#ede9fe" class="grid"/><text x="280" y="66" text-anchor="middle" class="small">T1·V3</text>
      <rect x="0" y="80" width="80" height="40" fill="#dcfce7" class="grid"/><text x="40" y="106" text-anchor="middle" class="small">T2·V0</text>
      <rect x="80" y="80" width="80" height="40" fill="#dcfce7" class="grid"/><text x="120" y="106" text-anchor="middle" class="small">T2·V1</text>
      <rect x="160" y="80" width="80" height="40" fill="#dcfce7" class="grid"/><text x="200" y="106" text-anchor="middle" class="small">T2·V2</text>
      <rect x="240" y="80" width="80" height="40" fill="#dcfce7" class="grid"/><text x="280" y="106" text-anchor="middle" class="small">T2·V3</text>
      <rect x="0" y="120" width="80" height="40" fill="#ffedd5" class="grid"/><text x="40" y="146" text-anchor="middle" class="small">T3·V0</text>
      <rect x="80" y="120" width="80" height="40" fill="#ffedd5" class="grid"/><text x="120" y="146" text-anchor="middle" class="small">T3·V1</text>
      <rect x="160" y="120" width="80" height="40" fill="#ffedd5" class="grid"/><text x="200" y="146" text-anchor="middle" class="small">T3·V2</text>
      <rect x="240" y="120" width="80" height="40" fill="#ffedd5" class="grid"/><text x="280" y="146" text-anchor="middle" class="small">T3·V3</text>
    </g>
  </g>

  <g transform="translate(620,380)">
    <rect width="820" height="250" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="410" y="43" text-anchor="middle" class="head">固定运行时 thread id，得到局部 fragment</text>
    <rect x="55" y="78" width="260" height="100" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="185" y="115" text-anchor="middle" class="mono">P : (Thr, Val) → Offset</text>
    <text x="185" y="148" text-anchor="middle" class="small">静态 metadata 已经组合完成</text>
    <path class="edge" d="M320 128 H475"/>
    <text x="397" y="104" text-anchor="middle" class="body">slice thr = t</text>
    <rect x="480" y="78" width="285" height="100" rx="15" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="622" y="115" text-anchor="middle" class="mono">P(t, ·) : Val → Offset</text>
    <text x="622" y="148" text-anchor="middle" class="small">当前 thread 独占的 tensor view</text>
    <text x="410" y="217" text-anchor="middle" class="body">前提：image(T) ⊆ domain(A)；否则 composition 可能越界或不满足预期。</text>
  </g>

  <text x="750" y="672" text-anchor="middle" class="small">真实 MMA 的 T 通常交错得更复杂，但数学结构完全相同：指令给出 ownership，数据 layout 给出地址。</text>
</svg>
