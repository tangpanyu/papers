<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">层级 Shape 的等价坐标系统</title>
  <desc id="desc">展示 Shape 三乘二乘二的整数坐标、二维坐标与自然层级坐标之间的双射，并说明 colexicographical 顺序中第一个 mode 最快变化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .head { font-size: 24px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 16px; fill: #475569; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; font-size: 20px; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); marker-start: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="700" rx="26" fill="url(#bg)"/>
  <text x="750" y="54" text-anchor="middle" class="title">Shape S = (3, (2, 2))：同一元素的三种合法坐标</text>

  <g>
    <rect x="65" y="105" width="320" height="145" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="225" y="151" text-anchor="middle" class="head">整数坐标</text>
    <text x="225" y="193" text-anchor="middle" class="mono">i = 10 ∈ Z₁₂</text>
    <text x="225" y="224" text-anchor="middle" class="small">把整个 Shape 当作一维</text>

    <rect x="590" y="105" width="320" height="145" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text x="750" y="151" text-anchor="middle" class="head">rank-2 坐标</text>
    <text x="750" y="193" text-anchor="middle" class="mono">q = (1, 3) ∈ Z₍₃,₄₎</text>
    <text x="750" y="224" text-anchor="middle" class="small">第二个 multi-mode 暂时展平</text>

    <rect x="1115" y="105" width="320" height="145" rx="20" fill="#dcfce7" stroke="#10b981" stroke-width="3"/>
    <text x="1275" y="151" text-anchor="middle" class="head">自然坐标</text>
    <text x="1275" y="193" text-anchor="middle" class="mono">c_nat = (1, (1, 1))</text>
    <text x="1275" y="224" text-anchor="middle" class="small">与 S 完全同 profile</text>

    <path class="arrow" d="M390 178 H585"/>
    <text x="488" y="150" text-anchor="middle" class="small">idx2crd / crd2idx</text>
    <path class="arrow" d="M915 178 H1110"/>
    <text x="1012" y="150" text-anchor="middle" class="small">递归展开 / 折叠</text>
  </g>

  <g>
    <rect x="65" y="300" width="510" height="310" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="320" y="343" text-anchor="middle" class="head">Shape 的层级结构</text>
    <rect x="205" y="375" width="230" height="55" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="410" text-anchor="middle" class="mono">(3, (2, 2))</text>
    <path d="M280 430 V463 H180" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M360 430 V463 H460" fill="none" stroke="#64748b" stroke-width="3"/>
    <rect x="115" y="463" width="130" height="55" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="180" y="499" text-anchor="middle" class="mono">3</text>
    <rect x="380" y="463" width="160" height="55" rx="12" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="460" y="499" text-anchor="middle" class="mono">(2, 2)</text>
    <path d="M430 518 V548 H395" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M490 518 V548 H525" fill="none" stroke="#64748b" stroke-width="3"/>
    <circle cx="395" cy="560" r="24" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <circle cx="525" cy="560" r="24" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <text x="395" y="568" text-anchor="middle" class="mono">2</text>
    <text x="525" y="568" text-anchor="middle" class="mono">2</text>
  </g>

  <g>
    <rect x="620" y="300" width="815" height="310" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="1028" y="343" text-anchor="middle" class="head">Colex 枚举：第一个 mode 最快变化</text>

    <g transform="translate(655,380)">
      <rect x="0" y="0" width="58" height="62" rx="9" fill="#dbeafe"/><text x="29" y="25" text-anchor="middle" class="small">i=0</text><text x="29" y="49" text-anchor="middle" class="small">(0,0)</text>
      <rect x="64" y="0" width="58" height="62" rx="9" fill="#dbeafe"/><text x="93" y="25" text-anchor="middle" class="small">1</text><text x="93" y="49" text-anchor="middle" class="small">(1,0)</text>
      <rect x="128" y="0" width="58" height="62" rx="9" fill="#dbeafe"/><text x="157" y="25" text-anchor="middle" class="small">2</text><text x="157" y="49" text-anchor="middle" class="small">(2,0)</text>
      <rect x="192" y="0" width="58" height="62" rx="9" fill="#ede9fe"/><text x="221" y="25" text-anchor="middle" class="small">3</text><text x="221" y="49" text-anchor="middle" class="small">(0,1)</text>
      <rect x="256" y="0" width="58" height="62" rx="9" fill="#ede9fe"/><text x="285" y="25" text-anchor="middle" class="small">4</text><text x="285" y="49" text-anchor="middle" class="small">(1,1)</text>
      <rect x="320" y="0" width="58" height="62" rx="9" fill="#ede9fe"/><text x="349" y="25" text-anchor="middle" class="small">5</text><text x="349" y="49" text-anchor="middle" class="small">(2,1)</text>
      <rect x="384" y="0" width="58" height="62" rx="9" fill="#dcfce7"/><text x="413" y="25" text-anchor="middle" class="small">6</text><text x="413" y="49" text-anchor="middle" class="small">(0,2)</text>
      <rect x="448" y="0" width="58" height="62" rx="9" fill="#dcfce7"/><text x="477" y="25" text-anchor="middle" class="small">7</text><text x="477" y="49" text-anchor="middle" class="small">(1,2)</text>
      <rect x="512" y="0" width="58" height="62" rx="9" fill="#dcfce7"/><text x="541" y="25" text-anchor="middle" class="small">8</text><text x="541" y="49" text-anchor="middle" class="small">(2,2)</text>
      <rect x="576" y="0" width="58" height="62" rx="9" fill="#ffedd5"/><text x="605" y="25" text-anchor="middle" class="small">9</text><text x="605" y="49" text-anchor="middle" class="small">(0,3)</text>
      <rect x="640" y="0" width="58" height="62" rx="9" fill="#fed7aa" stroke="#f97316" stroke-width="3"/><text x="669" y="25" text-anchor="middle" class="small">10</text><text x="669" y="49" text-anchor="middle" class="small">(1,3)</text>
      <rect x="704" y="0" width="58" height="62" rx="9" fill="#ffedd5"/><text x="733" y="25" text-anchor="middle" class="small">11</text><text x="733" y="49" text-anchor="middle" class="small">(2,3)</text>
    </g>

    <text x="1028" y="490" text-anchor="middle" class="mono">i = c₀ + 3(c₁ + 2c₂)</text>
    <text x="1028" y="530" text-anchor="middle" class="body">10 = 1 + 3(1 + 2·1)，所以 10 ↔ (1,3) ↔ (1,(1,1))</text>
    <text x="1028" y="570" text-anchor="middle" class="small">括号改变可见的 mode 结构，但不改变元素总数 |S| = 3·2·2 = 12。</text>
  </g>

  <text x="750" y="665" text-anchor="middle" class="small">CuTe 的默认一维遍历采用 colexicographical order；不要把它与 C/C++ 常见的“最后一维最快”混为一谈。</text>
</svg>
