<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">四种四乘四 layout 的 offset 表</title>
  <desc id="desc">对比 column-major、row-major、padded 和 broadcast layout，展示 compact、hole 与 collision。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .head { font-size: 23px; font-weight: 700; }
      .formula { font-family: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; font-size: 18px; }
      .cell { font-size: 18px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #475569; }
      .grid { stroke: #94a3b8; stroke-width: 2; }
    </style>
    <g id="grid4">
      <rect width="240" height="240" fill="#fff" stroke="#64748b" stroke-width="3"/>
      <path d="M60 0V240 M120 0V240 M180 0V240 M0 60H240 M0 120H240 M0 180H240" class="grid"/>
    </g>
  </defs>

  <rect width="1500" height="760" rx="26" fill="#f8fafc"/>
  <text x="750" y="55" text-anchor="middle" class="title">Shape 相同不代表函数相同：四个 (4,4) Layout</text>
  <text x="750" y="88" text-anchor="middle" class="small">表格的行是 m、列是 n，单元格中是 L(m,n) 产生的 offset。</text>

  <g transform="translate(30,115)">
    <rect width="345" height="575" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="172" y="42" text-anchor="middle" class="head">Column-major</text>
    <text x="172" y="76" text-anchor="middle" class="formula">(4,4):(1,4)</text>
    <g transform="translate(52,105)"><use href="#grid4"/></g>
    <g transform="translate(52,105)" class="cell" text-anchor="middle">
      <text x="30" y="38">0</text><text x="90" y="38">4</text><text x="150" y="38">8</text><text x="210" y="38">12</text>
      <text x="30" y="98">1</text><text x="90" y="98">5</text><text x="150" y="98">9</text><text x="210" y="98">13</text>
      <text x="30" y="158">2</text><text x="90" y="158">6</text><text x="150" y="158">10</text><text x="210" y="158">14</text>
      <text x="30" y="218">3</text><text x="90" y="218">7</text><text x="150" y="218">11</text><text x="210" y="218">15</text>
    </g>
    <text x="172" y="388" text-anchor="middle" class="formula">L(m,n)=m+4n</text>
    <text x="172" y="426" text-anchor="middle" class="body">image = {0,…,15}</text>
    <rect x="50" y="452" width="245" height="74" rx="13" fill="#dbeafe"/>
    <text x="172" y="480" text-anchor="middle" class="body">无 collision、无 hole</text>
    <text x="172" y="507" text-anchor="middle" class="small">对 I₁₆ 是双射 / compact</text>
  </g>

  <g transform="translate(395,115)">
    <rect width="345" height="575" rx="20" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
    <text x="172" y="42" text-anchor="middle" class="head">Row-major</text>
    <text x="172" y="76" text-anchor="middle" class="formula">(4,4):(4,1)</text>
    <g transform="translate(52,105)"><use href="#grid4"/></g>
    <g transform="translate(52,105)" class="cell" text-anchor="middle">
      <text x="30" y="38">0</text><text x="90" y="38">1</text><text x="150" y="38">2</text><text x="210" y="38">3</text>
      <text x="30" y="98">4</text><text x="90" y="98">5</text><text x="150" y="98">6</text><text x="210" y="98">7</text>
      <text x="30" y="158">8</text><text x="90" y="158">9</text><text x="150" y="158">10</text><text x="210" y="158">11</text>
      <text x="30" y="218">12</text><text x="90" y="218">13</text><text x="150" y="218">14</text><text x="210" y="218">15</text>
    </g>
    <text x="172" y="388" text-anchor="middle" class="formula">L(m,n)=4m+n</text>
    <text x="172" y="426" text-anchor="middle" class="body">image = {0,…,15}</text>
    <rect x="50" y="452" width="245" height="74" rx="13" fill="#ede9fe"/>
    <text x="172" y="480" text-anchor="middle" class="body">无 collision、无 hole</text>
    <text x="172" y="507" text-anchor="middle" class="small">同样双射，只是遍历方向不同</text>
  </g>

  <g transform="translate(760,115)">
    <rect width="345" height="575" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="172" y="42" text-anchor="middle" class="head">Padded column-major</text>
    <text x="172" y="76" text-anchor="middle" class="formula">(4,4):(1,5)</text>
    <g transform="translate(52,105)"><use href="#grid4"/></g>
    <g transform="translate(52,105)" class="cell" text-anchor="middle">
      <text x="30" y="38">0</text><text x="90" y="38">5</text><text x="150" y="38">10</text><text x="210" y="38">15</text>
      <text x="30" y="98">1</text><text x="90" y="98">6</text><text x="150" y="98">11</text><text x="210" y="98">16</text>
      <text x="30" y="158">2</text><text x="90" y="158">7</text><text x="150" y="158">12</text><text x="210" y="158">17</text>
      <text x="30" y="218">3</text><text x="90" y="218">8</text><text x="150" y="218">13</text><text x="210" y="218">18</text>
    </g>
    <text x="172" y="388" text-anchor="middle" class="formula">L(m,n)=m+5n</text>
    <text x="172" y="426" text-anchor="middle" class="body">I₁₉ 中缺少 4、9、14</text>
    <rect x="50" y="452" width="245" height="74" rx="13" fill="#ffedd5"/>
    <text x="172" y="480" text-anchor="middle" class="body">无 collision，但存在 hole</text>
    <text x="172" y="507" text-anchor="middle" class="small">单射；size=16，span=19</text>
  </g>

  <g transform="translate(1125,115)">
    <rect width="345" height="575" rx="20" fill="#fef2f2" stroke="#f87171" stroke-width="3"/>
    <text x="172" y="42" text-anchor="middle" class="head">Broadcast</text>
    <text x="172" y="76" text-anchor="middle" class="formula">(4,4):(0,1)</text>
    <g transform="translate(52,105)"><use href="#grid4"/></g>
    <g transform="translate(52,105)" class="cell" text-anchor="middle">
      <text x="30" y="38">0</text><text x="90" y="38">1</text><text x="150" y="38">2</text><text x="210" y="38">3</text>
      <text x="30" y="98">0</text><text x="90" y="98">1</text><text x="150" y="98">2</text><text x="210" y="98">3</text>
      <text x="30" y="158">0</text><text x="90" y="158">1</text><text x="150" y="158">2</text><text x="210" y="158">3</text>
      <text x="30" y="218">0</text><text x="90" y="218">1</text><text x="150" y="218">2</text><text x="210" y="218">3</text>
    </g>
    <text x="172" y="388" text-anchor="middle" class="formula">L(m,n)=n</text>
    <text x="172" y="426" text-anchor="middle" class="body">16 个输入只产生 4 个 offset</text>
    <rect x="50" y="452" width="245" height="74" rx="13" fill="#fee2e2"/>
    <text x="172" y="480" text-anchor="middle" class="body">大量 collision，覆盖 I₄</text>
    <text x="172" y="507" text-anchor="middle" class="small">对 I₄ 满射，但不是单射</text>
  </g>

  <text x="750" y="735" text-anchor="middle" class="small">所有 layout 的 domain cardinality 都是 size=16；差异完全发生在 image 的形状、碰撞与空洞上。</text>
</svg>
